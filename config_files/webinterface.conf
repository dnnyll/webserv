# =============================================================================
# webinterface.conf — serves the www/index/index.html test console
#
# Usage: ./webserv config_files/webinterface.conf
#   Test console: http://localhost:8080/
# =============================================================================

server {
	listen 8080;

	server_name webinterface;

	client_max_body_size 10000000;

	root www;

	# serves www/index/index.html at "/"
	location / {
		root                    www/index;
		index                   index.html;
		autoindex               off;
		methods                 GET;
	}

	# directory listing for GET tests
	location /files {
		root                    www;
		autoindex               on;
		methods                 GET;
	}

	# CGI scripts — used by the GET and POST test sections
	location /cgi-bin {
		root                    www;
		cgi_pass                .py /usr/bin/python3;
		cgi_pass                .sh /usr/bin/bash;
		methods                 GET POST;
	}

	# upload / delete tests
	location /upload {
		root                    www;
		methods                 GET POST DELETE;
		upload_store            ./www/upload;
		autoindex               on;
	}
}