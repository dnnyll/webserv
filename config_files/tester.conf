server {
	listen 8080;
	server_name tester;

	client_max_body_size 10000000;

	# /
	location / {
		root                    YoupiBanane;
		index                   youpi.bad_extension;
		autoindex               off;
		methods                 GET;
	}

	# Any "*.bla" => POST calls cgi_test
	location / {
		root                    YoupiBanane;
		methods                 POST;
		client_max_body_size    10000000;

		cgi_pass                .bla /usr/bin/cgi_test;
	}

	# /post_body => answer anything to POST with maxBody 100
	location /post_body {
		root                    YoupiBanane;
		methods                 POST;
		client_max_body_size    100;
	}

	# /directory/ => GET only, root is YoupiBanane
	# If no file requested, search for youpi.bad_extension
	location /directory {
		root                    YoupiBanane;
		index                   youpi.bad_extension;
		autoindex               off;
		methods                 GET;
	}
}
