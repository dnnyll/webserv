server {
    listen 8081;
    host 127.0.0.1;
    server_name test_small;

    root ./www;
    client_max_body_size 10;

    error_page 413 /errors/413.html;
    error_page 400 /errors/400.html;

    location / {
        methods GET;
        index index.html;
        autoindex off;
    }

    location /echo {
        methods GET POST DELETE;
        upload_store ./uploads;
    }
}
