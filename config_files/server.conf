server {
	listen 8080;
	host 127.0.0.1;
	server_name example.com;
	error_page 404 /errors/404.html;
	client_max_body_size 1000000;

	location / {
		root /var/www/html;
		index index.html;
		methods GET POST;
		autoindex off;
	}

	location /upload {
		root /var/www/uploads;
		methods POST DELETE;
		upload_store /var/www/uploads;
	}

	location /cgi-bin {
		root /var/www/cgi-bin;
		cgi_pass .php /usr/bin/php-cgi;
		methods GET POST;
	}
}

server {
	listen 8081;
	host 127.0.0.1;
	server_name second.com;

	location / {
		root /var/www/second;
		methods GET;
	}
}